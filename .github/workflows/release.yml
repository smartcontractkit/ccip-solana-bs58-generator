name: Release

on:
  push:
    tags: ['v*']

# A tag produces exactly one artifact: the tarball users install. It is built here, from the
# committed lockfile, rather than on a maintainer's laptop - so two people installing the same
# version get bytes built from the same dependency tree. That matters for a tool whose output
# people sign.
#
# There is no fallback path. `npm i -g "git+https://..."` fails on npm 11 (its nested build step
# does not provide the compiler, so `prepare` cannot run `tsc`), so this release IS the install.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json produces a release whose filename, `--version` and
      # docs URL all contradict each other. Stop before that ships.
      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
        id: version

      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:gate

      - name: Pack
        run: npm pack --pack-destination /tmp

      # Install what is about to be published, not what is in the working tree.
      - name: Smoke test the tarball
        working-directory: /
        run: |
          set -euo pipefail
          npm i -g /tmp/chainlink-ccip-solana-bs58-generator-*.tgz
          test "$(cct-solana-tx --version)" = "${{ steps.version.outputs.version }}"
          docs="$(cct-solana-tx docs --path)"
          test -f "$docs/commands/catalog.json"
          cct-solana-tx bm --help >/dev/null

      # `gh` is preinstalled on GitHub runners; no third-party action needed to cut a release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cat > /tmp/notes.md <<EOF
          Unaudited Chainlink example/template. Test on devnet.

          Install (Node >= 22):

          \`\`\`bash
          npm i -g https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/chainlink-ccip-solana-bs58-generator-${version}.tgz
          cct-solana-tx --version
          \`\`\`

          The documentation ships inside the package; \`cct-solana-tx docs --path\` prints it.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            /tmp/chainlink-ccip-solana-bs58-generator-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --prerelease
