name: CI

on:
  pull_request:
  push:
    branches: [main]

# The repo's own quality gates already exist as scripts; this runs them where they cannot be
# skipped. The pre-commit hook is convenience - it does not run for anyone who clones without
# installing, and `git commit --no-verify` walks straight past it.
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor in engines; 24 is what most contributors have. Both are tested because
        # the difference between them has already broken this package once: Node 22 removed the
        # `assert { type: 'json' }` import syntax the code used.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # pnpm arrives via corepack in the next step; skip the automatic packageManager cache,
          # which otherwise looks for pnpm before it exists and fails the job.
          package-manager-cache: false

      # `packageManager` in package.json pins the pnpm version, so corepack needs no arguments.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build

      # Catalog freshness, docs links, canonical facts, and the packaging contract.
      - run: pnpm docs:gate

  # Everything above tests the source. This tests the artifact, which is not the same thing: both
  # packaging bugs found so far (removed import-assertion syntax, and an entry-point guard that
  # never matched through a symlink) compiled cleanly, passed every test, and only failed once the
  # binary was installed and run.
  smoke-install:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack and install globally
        run: |
          npm pack --pack-destination /tmp
          npm i -g /tmp/chainlink-ccip-solana-bs58-generator-*.tgz

      # Run from a directory that is not the checkout, so nothing resolves by accident.
      - name: Run the installed binary
        working-directory: /
        run: |
          set -euo pipefail

          test "$(cct-solana-tx --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"

          # The docs have to ship and be locatable, or `docs --path` is a promise the package breaks.
          docs="$(cct-solana-tx docs --path)"
          test -d "$docs"
          test -f "$docs/commands/catalog.json"
          test "$(cct-solana-tx docs --list | wc -l)" -gt 50

          # --json is consumed by other tools; it must be strict JSON, not JSON-ish.
          cct-solana-tx docs --json | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))'

          # A topic must not escape the docs directory into the rest of the filesystem.
          if cct-solana-tx docs ../package.json >/dev/null 2>&1; then
            echo "docs <topic> escaped the docs directory" >&2
            exit 1
          fi

          # Subcommands load the full program registry, which is where a bad import kills the CLI.
          cct-solana-tx --help >/dev/null
          cct-solana-tx bm --help >/dev/null
