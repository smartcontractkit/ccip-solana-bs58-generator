# allowBuilds decides which dependencies may run install scripts. Without it, pnpm 10 aborts every
# script (including `pnpm bs58`) with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  # esbuild links its platform binary in a postinstall; tsx needs it.
  esbuild: true
  # Optional native speedups. Disabled: bigint-buffer falls back to pure JS and ws to its JS path.
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
